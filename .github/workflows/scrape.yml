name: Scrape river water level (10min)

on:
  schedule:
    # 10分ごと(GitHub Actionsのcronは実際には数分〜十数分の遅延が起こり得ます)
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run scraper
        run: python scrape.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update river data ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git pull --rebase origin main
          git push
